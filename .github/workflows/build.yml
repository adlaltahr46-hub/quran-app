name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move files into assets
        run: |
          mkdir -p assets
          if [ ! -f assets/quran.txt ]; then mv quran*.txt assets/quran.txt; fi
          if [ -f icon-1.png ]; then mv icon-1.png assets/icon.png; elif [ -f icon.png ]; then mv icon.png assets/icon.png; fi

      - name: Download Quran font (Amiri Quran)
        run: |
          mkdir -p assets/fonts
          curl -fL --retry 3 -o assets/fonts/AmiriQuran.ttf https://mirrors.ctan.org/fonts/amiri/AmiriQuran.ttf || curl -fL --retry 3 -o assets/fonts/AmiriQuran.ttf https://mirrors.mit.edu/CTAN/fonts/amiri/AmiriQuran.ttf || true
          if [ -f assets/fonts/AmiriQuran.ttf ] && [ "$(stat -c%s assets/fonts/AmiriQuran.ttf)" -gt 50000 ]; then
            python3 - <<'EOF'
          p = 'pubspec.yaml'
          s = open(p, encoding='utf-8').read()
          s = s.replace('  uses-material-design: true', '  uses-material-design: true\n  fonts:\n    - family: AmiriQuran\n      fonts:\n        - asset: assets/fonts/AmiriQuran.ttf', 1)
          open(p, 'w', encoding='utf-8').write(s)
          EOF
            echo "font installed"
          else
            rm -f assets/fonts/AmiriQuran.ttf
            echo "font download failed, using default font"
          fi

      - name: Hook up reminder in Dart code
        run: |
          python3 - <<'EOF'
          p = 'lib/main.dart'
          s = open(p, encoding='utf-8').read()
          s = "import 'reminder.dart';\n" + s
          a = "runApp(const QuranApp());"
          assert a in s
          s = s.replace(a, a + "\n  StreakService.load().then((s) => Reminder.schedule(readToday: s.doneToday));", 1)
          b = "if (n != null && mounted) setState(() => newStreak = n);"
          assert b in s
          s = s.replace(b, b + "\n    if (n != null) Reminder.schedule(readToday: true);", 1)
          open(p, 'w', encoding='utf-8').write(s)
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: flutter create --platforms=android --org com.example .

      - name: Set app name
        run: sed -i 's/android:label="[^"]*"/android:label="القرآن الكريم"/' android/app/src/main/AndroidManifest.xml

      - name: Configure Android for notifications
        run: |
          python3 - <<'EOF'
          import os

          mp = 'android/app/src/main/AndroidManifest.xml'
          m = open(mp, encoding='utf-8').read()
          perms = '''    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
          '''
          receivers = '''        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                          <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
                      </intent-filter>
                  </receiver>
          '''
          m = m.replace('<application', perms + '    <application', 1)
          m = m.replace('</application>', receivers + '    </application>', 1)
          open(mp, 'w', encoding='utf-8').write(m)

          kts = 'android/app/build.gradle.kts'
          groovy = 'android/app/build.gradle'
          if os.path.exists(kts):
              g = open(kts, encoding='utf-8').read()
              g = g.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
              g = g.replace('release {', 'release {\n            isMinifyEnabled = false\n            isShrinkResources = false', 1)
              g += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              open(kts, 'w', encoding='utf-8').write(g)
          else:
              g = open(groovy, encoding='utf-8').read()
              g = g.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
              g = g.replace('release {', 'release {\n            minifyEnabled false\n            shrinkResources false', 1)
              g += '\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"\n}\n'
              open(groovy, 'w', encoding='utf-8').write(g)
          EOF

      - name: Get packages
        run: flutter pub get

      - name: Create launcher icons
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: quran-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
