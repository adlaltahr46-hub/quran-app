name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move files into assets
        run: |
          mkdir -p assets
          if [ ! -f assets/quran.txt ]; then mv quran*.txt assets/quran.txt; fi
          if [ -f icon-1.png ]; then mv icon-1.png assets/icon.png; elif [ -f icon.png ]; then mv icon.png assets/icon.png; fi

      - name: Add background pattern
        run: |
          sed -i "1i import 'pattern.dart';" lib/main.dart
          sed -i 's/SingleChildScrollView(/PatternScroll(/' lib/main.dart

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: flutter create --platforms=android --org com.example .

      - name: Set app name
        run: sed -i 's/android:label="[^"]*"/android:label="القرآن الكريم"/' android/app/src/main/AndroidManifest.xml

      - name: Get packages
        run: flutter pub get

      - name: Create launcher icons
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: quran-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
